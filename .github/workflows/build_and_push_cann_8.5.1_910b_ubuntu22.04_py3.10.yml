name: Build and Publish CANN 8.5.1-910b-ubuntu22.04-py3.10

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the image'
        default: false
        type: boolean
        required: true

jobs:
  only-build:
    name: build 8.5.1-910b-ubuntu22.04-py3.10 (${{ matrix.arch }})
    if: ${{ !inputs.publish }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: linux-x86_64
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        id: build
        with:
          platforms: ${{ matrix.arch }}
          file: ${{ github.workspace }}/cann/8.5.1-910b-ubuntu22.04-py3.10/Dockerfile
          context: ${{ github.workspace }}/cann/8.5.1-910b-ubuntu22.04-py3.10
          outputs: type=oci,dest=/tmp/image-${{ matrix.arch }}.tar
          provenance: false

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.arch }}
          path: /tmp/image-${{ matrix.arch }}.tar
          retention-days: 1

  merge-multiarch:
    name: merge multi-arch image
    if: ${{ !inputs.publish }}
    needs: only-build
    runs-on: ubuntu-latest
    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: image-x86_64
          path: /tmp/artifacts

      - name: Download aarch64 artifact
        uses: actions/download-artifact@v4
        with:
          name: image-aarch64
          path: /tmp/artifacts

      - name: Start local registry
        run: docker run -d -p 5000:5000 --name registry registry:2

      - name: Configure buildx for insecure registry
        run: |
          cat > /tmp/buildkitd.toml << 'EOF'
          [registry."localhost:5000"]
            http = true
            insecure = true
          EOF
          docker buildx create --use --name insecure-builder --config /tmp/buildkitd.toml

      - name: Install crane
        run: |
          curl -sL https://github.com/google/go-containerregistry/releases/latest/download/go-containerregistry_Linux_x86_64.tar.gz \
            | sudo tar -xz -C /usr/local/bin crane

      - name: Push arch images to local registry
        run: |
          crane --insecure push /tmp/artifacts/image-x86_64.tar localhost:5000/cann:x86_64
          crane --insecure push /tmp/artifacts/image-aarch64.tar localhost:5000/cann:aarch64

      - name: Create multi-arch manifest
        run: |
          docker buildx imagetools create --insecure \
            -t localhost:5000/cann:8.5.1-910b-ubuntu22.04-py3.10 \
            localhost:5000/cann:x86_64 \
            localhost:5000/cann:aarch64

      - name: Export multi-arch image
        run: |
          skopeo copy --insecure-policy --src-tls-verify=false --all \
            docker://localhost:5000/cann:8.5.1-910b-ubuntu22.04-py3.10 \
            oci-archive:/tmp/cann-8.5.1-910b-ubuntu22.04-py3.10-multiarch.tar:8.5.1-910b-ubuntu22.04-py3.10

      - name: Upload multi-arch artifact
        uses: actions/upload-artifact@v4
        with:
          name: cann-8.5.1-910b-ubuntu22.04-py3.10-multiarch
          path: /tmp/cann-8.5.1-910b-ubuntu22.04-py3.10-multiarch.tar
          retention-days: 3

  build-push-digest:
    name: build 8.5.1-910b-ubuntu22.04-py3.10 (${{ matrix.arch }})
    if: ${{ inputs.publish }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: linux-x86_64
          - arch: aarch64
            runner: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free up disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          docker-images: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
          ecr: false
          logout: false

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push by digest
        uses: docker/build-push-action@v6
        id: build
        with:
          platforms: ${{ matrix.arch }}
          tags: |
            docker.io/ascendai/cann
            quay.io/ascend/cann
          file: ${{ github.workspace }}/cann/8.5.1-910b-ubuntu22.04-py3.10/Dockerfile
          context: ${{ github.workspace }}/cann/8.5.1-910b-ubuntu22.04-py3.10
          outputs: type=image,push-by-digest=true,name-canonical=true,push=true
          provenance: false

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-8.5.1-910b-ubuntu22.04-py3.10-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  push-image:
    runs-on: ubuntu-latest
    needs: build-push-digest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-8.5.1-910b-ubuntu22.04-py3.10-*
          merge-multiple: true

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare tags
        id: prepare-tags
        run: |
          BASE_TAGS=$(jq -r \
            '.versions[] | select(.path == "cann/8.5.1-910b-ubuntu22.04-py3.10") | .tags[]' \
            cann_publish_version.json)
          registries=(
            "docker.io/ascendai/cann"
            "quay.io/ascend/cann"
          )
          first=true
          TAGS_JSON="["
          for registry in "${registries[@]}"; do
            for tag in $(echo "$BASE_TAGS" | tr ',' ' '); do
              if [ "$first" != true ]; then
                TAGS_JSON+=","
              fi
              TAGS_JSON+="\"${registry}:${tag}\""
              first=false
            done
          done
          TAGS_JSON+="]"
          echo "tags=${TAGS_JSON}" >> $GITHUB_OUTPUT

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.prepare-tags.outputs.tags }}
        run: |
          readarray -t TAGS_ARRAY <<< "$(echo "$TAGS" | jq -r '.[]')"

          for TAG in "${TAGS_ARRAY[@]}"; do
            if [[ "$TAG" == *"quay.io/ascend/cann"* ]]; then
              docker buildx imagetools create -t "$TAG" \
                $(printf 'quay.io/ascend/cann@sha256:%s ' *)
            elif [[ "$TAG" == *"docker.io/ascendai/cann"* ]]; then
              docker buildx imagetools create -t "$TAG" \
                $(printf 'docker.io/ascendai/cann@sha256:%s ' *)
            else
              echo "Error: Unknown registry in TAG: $TAG"
              exit 1
            fi
          done

  sync-image:
    runs-on: ubuntu-latest
    needs: push-image
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install skopeo
        run: |
          sudo apt update
          sudo apt install -y skopeo

      - name: Login to Huawei Cloud SWR
        run: |
          echo "${{ secrets.HW_TOKEN }}" | skopeo login \
            --username "${{ secrets.HW_USERNAME }}" \
            --password-stdin \
            swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci

      - name: Login to AscendHub
        run: |
          echo "${{ secrets.ASCENDHUB_TOKEN }}" | skopeo login \
            --username "${{ secrets.ASCENDHUB_USERNAME }}" \
            --password-stdin \
            swr.cn-east-3.myhuaweicloud.com/ascendhub-test

      - name: Sync image
        run: |
          skopeo copy --all \
          docker://quay.io/ascend/cann:8.5.1-910b-ubuntu22.04-py3.10 \
          docker://swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/cann:8.5.1-910b-ubuntu22.04-py3.10

          skopeo copy --all \
          docker://quay.io/ascend/cann:8.5.1-910b-ubuntu22.04-py3.10 \
          docker://swr.cn-east-3.myhuaweicloud.com/ascendhub-test/cann:8.5.1-910b-ubuntu22.04-py3.10
